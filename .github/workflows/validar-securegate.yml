name: Validar SecureGate en Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: ['integracion/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securegate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-y-probar:
    name: Compilacion y pruebas Windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6
        # Credencial temporal de solo lectura; checkout limpia al terminar.

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Compilar solucion completa
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build SecureGate.Equipo.slnx -c Release -m:1
          if ($LASTEXITCODE -ne 0) { throw "Fallo la compilacion." }

      - name: Verificar sintaxis del actualizador de entrega
        shell: pwsh
        run: |
          $tokens = $null
          $errores = $null
          foreach ($nombre in @('ActualizarDecisionInteractiva.ps1','PrepararClienteAutomatico.ps1')) {
            [Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD ('herramientas/SecureGate.Entrega/' + $nombre)),
              [ref]$tokens, [ref]$errores) | Out-Null
            if ($errores.Count -gt 0) { throw ($errores.Message -join "`n") }
          }

      - name: Verificar preparacion automatica del lanzador
        shell: pwsh
        run: |
          & ./herramientas/SecureGate.Comportamiento/ProbarLanzador.ps1

      - name: Ejecutar pruebas aisladas sin claves ni muestras reales
        env:
          SECUREGATE_DECISION_QA_DIR: '${{ runner.temp }}/securegate-decision-qa'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pruebas = @(
            @{ Nombre="SecureGate.Comportamiento.Pruebas"; Args=@() },
            @{ Nombre="SecureGate.Decisiones.Pruebas"; Args=@() },
            @{ Nombre="SecureGate.Alcance.Pruebas"; Args=@() },
            @{ Nombre="SecureGate.Ia.Pruebas"; Args=@() },
            @{ Nombre="SecureGate.Seguridad.Pruebas"; Args=@() },
            @{ Nombre="SecureGate.Cliente.Pruebas"; Args=@("--autopruebas") },
            @{ Nombre="SecureGate.Cliente.Pruebas"; Args=@("--persistencia") },
            @{ Nombre="SecureGate.Defender.Interpretacion.Pruebas"; Args=@() },
            @{ Nombre="SecureGate.Reutilizacion.Pruebas"; Args=@() },
            @{ Nombre="SecureGate.Reutilizacion.Flujo.Pruebas"; Args=@() },
            @{ Nombre="SecureGate.Liberacion.Pruebas"; Args=@() },
            @{ Nombre="SecureGate.Transporte.Pruebas"; Args=@() },
            @{ Nombre="SecureGate.Retencion.Pruebas"; Args=@() }
          )
          foreach ($prueba in $pruebas) {
            $proyecto = "pruebas/" + $prueba.Nombre + "/" + $prueba.Nombre + ".csproj"
            $argumentos = @("run", "-c", "Release", "--no-build", "--project", $proyecto)
            if ($prueba.Args.Count -gt 0) { $argumentos += "--"; $argumentos += $prueba.Args }
            Write-Host "VERIFICANDO:" $prueba.Nombre
            & dotnet @argumentos
            if ($LASTEXITCODE -ne 0) { throw "Fallo la prueba $($prueba.Nombre)." }
          }
          "Compilacion y 13 ejecuciones de pruebas aisladas aprobadas en Windows." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Probar observador real con muestra benigna en Windows
        env:
          SECUREGATE_DECISION_QA_DIR: '${{ runner.temp }}/securegate-decision-qa'
        shell: pwsh
        run: |
          & ./herramientas/SecureGate.Comportamiento/ProbarObservadorWindows.ps1
          & ./herramientas/SecureGate.Comportamiento/ProbarObservadorWindows.ps1 -DemoFirmada

      - name: Guardar capturas de los cuadros de decision
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cuadros-decision-windows
          path: '${{ runner.temp }}/securegate-decision-qa/*'
          if-no-files-found: ignore
